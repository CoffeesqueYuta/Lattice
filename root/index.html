<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* ===== Timestamp / misc ===== */

        .timestamp {
            text-align: center;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const main = document.querySelector("main");
            const sidebar = document.getElementById("sidebar");
            const toggleButton = document.getElementById("toggleButton");

            main.addEventListener("click", function () {
                sidebar.classList.remove("expanded");
                sidebar.classList.add("collapsed");
            });

            if (toggleButton && sidebar) {
                toggleButton.addEventListener("click", function () {
                    if (sidebar.classList.contains("expanded")) {
                        sidebar.classList.remove("expanded");
                        sidebar.classList.add("collapsed");
                    } else {
                        sidebar.classList.remove("collapsed");
                        sidebar.classList.add("expanded");
                    }
                });
            }

            customElements.whenDefined('login-form-popup').then(function () {
                let openTries = 0;
                const maxOpenTries = 120;
                const openLoginTimer = setInterval(function () {
                    try {
                        openPopup('login-form', 1);
                        clearInterval(openLoginTimer);
                    } catch (error) {
                        openTries += 1;
                        if (openTries >= maxOpenTries) {
                            clearInterval(openLoginTimer);
                            console.error('Failed to open login-form popup.', error);
                        }
                    }
                }, 50);
            });
        });
    </script>
</head>
